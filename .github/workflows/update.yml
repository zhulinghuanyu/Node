name: Update subscriptions

on:
  workflow_dispatch:
  schedule:
    # Every 30 minutes. GitHub cron is UTC.
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: subscription-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Start subconverter
        run: |
          docker run -d --name subconverter -p 25500:25500 tindy2013/subconverter:latest
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:25500/version; then
              echo
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:25500/version

      - name: Crawl and convert
        env:
          SUBCONVERTER_URL: http://127.0.0.1:25500
        run: python scripts/crawl.py

      - name: Show result
        run: |
          echo "===== status.json ====="
          cat output/status.json
          echo "===== output files ====="
          ls -lh output/

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update subscriptions"
            git push
          fi

      - name: Cleanup
        if: always()
        run: docker rm -f subconverter || true
