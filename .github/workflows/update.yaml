name: Update subscriptions

on:
  workflow_dispatch:
  schedule:
    # Every 30 minutes, UTC.
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: subscription-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Start subconverter
        run: |
          docker run -d             --name subconverter             -p 25500:25500             tindy2013/subconverter:latest

          echo "Waiting for subconverter..."
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:25500/version; then
              echo
              echo "subconverter is ready."
              break
            fi

            if [ "$i" -eq 45 ]; then
              echo "subconverter failed to start"
              docker logs subconverter || true
              exit 1
            fi

            sleep 2
          done

      - name: Crawl and convert
        env:
          SUBCONVERTER_URL: http://127.0.0.1:25500
          FETCH_TIMEOUT: "30"
          CONVERT_TIMEOUT: "180"
        run: |
          python scripts/crawl.py

      - name: Show result
        if: always()
        run: |
          echo "===== status.json ====="
          if [ -f output/status.json ]; then cat output/status.json; fi
          echo
          echo "===== files ====="
          ls -lah output/ || true

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/

          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "chore: update subscriptions"
            git push
          fi

      - name: Cleanup subconverter
        if: always()
        run: |
          docker rm -f subconverter || true
