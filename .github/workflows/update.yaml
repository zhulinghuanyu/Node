name: Update Subscription Links

on:
  schedule:
    # 定时任务，使用cron表达式。这里是每天UTC时间0点运行（北京时间早上8点）
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  update-subscriptions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pyyaml github3.py

      - name: Run subscription updater script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # 自动提供的Token，有当前仓库的读写权限
        run: |
          # 将你的脚本文件名替换为实际名称，例如 update_subs.py
          python scrape.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add subscriptions/
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update subscription links [skip ci]"
          git push
